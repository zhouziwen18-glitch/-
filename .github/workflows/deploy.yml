name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 构建时内置论文自检：自动收录「参考文献」新增 PDF →
      # 复制到 public/论文、追加到 src/data/publications.ts、更新本地缓存
      - name: Build (auto-collect papers from 参考文献)
        run: npm run build

      # 把自检生成的数据改动（publications.ts + public/论文 新增 PDF）提交回仓库，
      # 确保「main」上的数据与收录一致，避免下一次 CI 重复收录。
      # 提交信息带 [skip ci]：该提交不会再触发本工作流，防止无限循环。
      - name: Commit auto-updated paper data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.ts public/论文 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::没有新增论文数据，无需提交"
          else
            git commit -m "docs(publications): auto-collect new papers from 参考文献 [skip ci]"
            git push origin HEAD:main
            echo "::notice::已自动提交自检生成的论文数据"
          fi

      - name: Verify picture directory in dist
        run: ls dist/picture/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
